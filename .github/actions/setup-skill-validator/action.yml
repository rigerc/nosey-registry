name: Set up skill-validator
description: Install the skill-validator version pinned in scripts/quality.mjs, cached by version.

runs:
  using: composite
  steps:
    - name: Read pinned version
      id: version
      shell: bash
      run: echo "version=$(node scripts/quality.mjs --print-version)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      id: cache
      with:
        path: ${{ runner.temp }}/bin/skill-validator
        key: ${{ runner.os }}-${{ runner.arch }}-skill-validator-${{ steps.version.outputs.version }}-go126
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        go-version: '1.26.10'
        cache: false
    - name: Install skill-validator
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        mkdir -p "$RUNNER_TEMP/bin"
        GOBIN="$RUNNER_TEMP/bin" go install "github.com/agent-ecosystem/skill-validator/cmd/skill-validator@${VERSION}"
    - name: Use pinned skill-validator
      shell: bash
      run: |
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/bin/skill-validator" --version
