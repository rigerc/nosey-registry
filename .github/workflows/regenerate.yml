name: Regenerate registry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-assessments
  cancel-in-progress: false
  queue: max

env:
  # Pinned nosey-9 generator commit. Bump deliberately; never use a branch.
  GENERATOR_REF: 1c7050db26516989ad8ff3d9b0bcdf4ff359eb19
  GENERATOR: github.com/rigerc/nosey-9/cmd/nosey

jobs:
  regenerate:
    if: github.repository == 'rigerc/nosey-registry' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: main
      - name: Check pending maintenance PRs
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/maintenance-pr.sh gate automation/regenerate
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: steps.gate.outputs.run == 'true'
        with:
          go-version: '1.26.10'
          cache: false
      - name: Generate
        if: steps.gate.outputs.run == 'true'
        run: go run ${GENERATOR}@${GENERATOR_REF} registry generate .
      - name: Reject stale registry inputs before publishing
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/maintenance-pr.sh assert-current
      - name: Open or update regeneration PR
        if: steps.gate.outputs.run == 'true'
        uses: peter-evans/create-pull-request@84ae59a2cdc2258d6fa0732dd66352dddae2a412 # v7.0.9
        with:
          token: ${{ secrets.REGISTRY_PR_TOKEN || github.token }}
          branch: automation/regenerate
          base: main
          delete-branch: true
          title: Regenerate registry JSON
          commit-message: Regenerate registry JSON
          body: |
            Generated by `nosey registry generate .`.

            Review the data change and the refreshed lock before merging.
