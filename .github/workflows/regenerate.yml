name: Regenerate registry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned nosey-9 generator commit. Bump deliberately; never use a branch.
  GENERATOR_REF: 23b90b13109ffa406658bd79d030c509ea6faf6d
  GENERATOR: github.com/rigerc/nosey-9/cmd/nosey

jobs:
  regenerate:
    if: github.repository == 'rigerc/nosey-registry'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Generate
        run: go run ${GENERATOR}@${GENERATOR_REF} registry generate .
      - name: Detect changes
        id: diff
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo changed=false >> "$GITHUB_OUTPUT"
          else
            echo changed=true >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update regeneration PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@84ae59a2cdc2258d6fa0732dd66352dddae2a412 # v7.0.9
        with:
          branch: automation/regenerate
          delete-branch: true
          title: Regenerate registry JSON
          commit-message: Regenerate registry JSON
          body: |
            Generated by `nosey registry generate .`.

            Review the data change and the refreshed lock before merging.
