name: Validate registry

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  # Pinned nosey-9 generator commit. Bump deliberately; never use a branch.
  GENERATOR_REF: 2c3876cbe8c17325c24890f2ce901755696b1698
  GENERATOR: github.com/rigerc/nosey-9/cmd/nosey

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Check generated output
        run: go run ${GENERATOR}@${GENERATOR_REF} registry generate . --check
      - name: Validate effective registry
        run: go run ${GENERATOR}@${GENERATOR_REF} registry validate . --standalone

  assessments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test assessment tooling
        run: node --test tests/*.test.mjs
      - name: Check assessments and their projection
        run: npm run --silent check
