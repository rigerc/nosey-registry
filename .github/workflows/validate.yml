name: Validate registry

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  # Pinned nosey-9 generator commit. Bump deliberately; never use a branch.
  GENERATOR_REF: 23b90b13109ffa406658bd79d030c509ea6faf6d
  GENERATOR: github.com/rigerc/nosey-9/cmd/nosey

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Check generated output
        run: go run ${GENERATOR}@${GENERATOR_REF} registry generate . --check
      - name: Validate effective registry
        run: go run ${GENERATOR}@${GENERATOR_REF} registry validate . --standalone
