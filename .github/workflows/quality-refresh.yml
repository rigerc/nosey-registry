name: Refresh skill quality

# Locates and evaluates only missing or stale pins (new or re-pinned skills, or
# after a skill-validator version/flag change), projects the results into the
# registry data and opens one review PR. Official registry only.
on:
  push:
    branches: [main]
    paths:
      - 'skills.json'
      - 'scripts/quality.mjs'
      - 'scripts/locate.mjs'
      - '.github/workflows/quality-refresh.yml'
  schedule:
    - cron: '17 8 * * 3'
  workflow_dispatch:
    inputs:
      all:
        description: 'Re-evaluate every skill, ignoring cached results'
        type: boolean
        default: false
      max_groups:
        description: 'Maximum repositories to fetch this run (chunk a large backfill)'
        default: '20'

permissions:
  contents: read

# Shared with score-jev.yml: both rewrite skills.json, so they must not overlap.
concurrency:
  group: registry-assessments
  cancel-in-progress: false

env:
  # Pinned nosey-9 generator commit. Bump deliberately; never use a branch.
  GENERATOR_REF: 2c3876cbe8c17325c24890f2ce901755696b1698
  GENERATOR: github.com/rigerc/nosey-9/cmd/nosey

jobs:
  refresh:
    if: github.repository == 'rigerc/nosey-registry'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Locate newly pinned skills (git transport, no API quota)
        run: node scripts/locate.mjs --write
      - name: Plan missing or stale skills (no upstream requests)
        id: plan
        env:
          EXTRA: ${{ inputs.all && '--all' || '' }}
          MAX_GROUPS: ${{ inputs.max_groups || '20' }}
        run: node scripts/quality.mjs --plan-refresh $EXTRA --max-groups "$MAX_GROUPS"
      - uses: ./.github/actions/setup-skill-validator
        if: steps.plan.outputs.groups != '0'
      - name: Evaluate missing and stale skills
        if: steps.plan.outputs.groups != '0'
        env:
          EXTRA: ${{ inputs.all && '--all' || '' }}
          MAX_GROUPS: ${{ inputs.max_groups || '20' }}
        run: node scripts/quality.mjs --write $EXTRA --max-groups "$MAX_GROUPS" --deadline-minutes 100
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Project results and regenerate the registry
        run: |
          set -euo pipefail
          node scripts/sync.mjs --write
          go run ${GENERATOR}@${GENERATOR_REF} registry generate .
      - name: Validate
        run: |
          set -euo pipefail
          node --test tests/*.test.mjs
          npm run --silent check
          go run ${GENERATOR}@${GENERATOR_REF} registry validate . --standalone
      - uses: peter-evans/create-pull-request@84ae59a2cdc2258d6fa0732dd66352dddae2a412 # v7.0.9
        with:
          token: ${{ github.token }}
          branch: automation/update-skill-quality
          base: main
          delete-branch: true
          add-paths: |
            assessments/locations.json
            assessments/quality.json
            skills.json
            nosey.registry.config.json
            nosey.registry.json
            nosey.registry.lock.json
          commit-message: 'chore: refresh skill quality results'
          title: 'chore: refresh skill quality results'
          body: |
            Generated by `scripts/quality.mjs` from skill-validator runs on pinned upstream skills, projected into `skills.json` by `scripts/sync.mjs`.
            See the workflow run summary for counts and failures. Quality results are not a security, licensing or availability audit.
