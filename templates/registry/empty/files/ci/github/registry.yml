# Registry validation and regeneration.
#
# GENERATOR_REF pins the nosey-9 generator. Bump it deliberately when the
# generator format changes; never point it at a branch.
name: Registry

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  GENERATOR_REF: 2c3876cbe8c17325c24890f2ce901755696b1698
  GENERATOR: github.com/rigerc/nosey-9/cmd/nosey

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Check generated output
        run: go run ${GENERATOR}@${GENERATOR_REF} registry generate . --check

  regenerate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Generate
        run: go run ${GENERATOR}@${GENERATOR_REF} registry generate .
      - name: Detect changes
        id: diff
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo changed=false >> "$GITHUB_OUTPUT"
          else
            echo changed=true >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update regeneration PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@84ae59a2cdc2258d6fa0732dd66352dddae2a412 # v7.0.9
        with:
          branch: automation/regenerate
          delete-branch: true
          title: Regenerate registry JSON
          commit-message: Regenerate registry JSON
          body: |
            Generated by `nosey registry generate .`.

            Review the data change and the refreshed lock before merging.

  refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Refresh upstream files
        run: go run ${GENERATOR}@${GENERATOR_REF} registry refresh .
      - name: Detect changes
        id: diff
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo changed=false >> "$GITHUB_OUTPUT"
          else
            echo changed=true >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update refresh PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@84ae59a2cdc2258d6fa0732dd66352dddae2a412 # v7.0.9
        with:
          branch: automation/refresh-upstream
          delete-branch: true
          title: Refresh registry upstream data
          commit-message: Refresh registry upstream data
          body: |
            Generated by `nosey registry refresh .`.

            Review the upstream revision and the refreshed outputs before merging.
