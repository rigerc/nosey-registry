# Registry validation and regeneration.
#
# GENERATOR_REF pins the nosey-9 generator. Bump it deliberately when the
# generator format changes; never point it at a branch.
name: Registry

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  GENERATOR_REF: 1c7050db26516989ad8ff3d9b0bcdf4ff359eb19
  GENERATOR: github.com/rigerc/nosey-9/cmd/nosey

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Check generated output
        run: go run ${GENERATOR}@${GENERATOR_REF} registry generate . --check

  regenerate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Generate
        run: go run ${GENERATOR}@${GENERATOR_REF} registry generate .
      - name: Detect changes
        id: diff
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo changed=false >> "$GITHUB_OUTPUT"
          else
            echo changed=true >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update regeneration PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@84ae59a2cdc2258d6fa0732dd66352dddae2a412 # v7.0.9
        with:
          branch: automation/regenerate
          delete-branch: true
          title: Regenerate registry JSON
          commit-message: Regenerate registry JSON
          body: |
            Generated by `nosey registry generate .`.

            Review the data change and the refreshed lock before merging.

  refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Refresh upstream files
        run: go run ${GENERATOR}@${GENERATOR_REF} registry refresh .
      - name: Detect changes
        id: diff
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo changed=false >> "$GITHUB_OUTPUT"
          else
            echo changed=true >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update refresh PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@84ae59a2cdc2258d6fa0732dd66352dddae2a412 # v7.0.9
        with:
          branch: automation/refresh-upstream
          delete-branch: true
          title: Refresh registry upstream data
          commit-message: Refresh registry upstream data
          body: |
            Generated by `nosey registry refresh .`.

            Review the upstream revision and the refreshed outputs before merging.

  readme-stats:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: readme-stats-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Detect relevant changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "push" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${BEFORE_SHA:-}" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" | grep -Eq '^(nosey\.registry\.config\.json|technologies\.json|skills\.json|mappings\.json|repositories\.json|\.github/scripts/registry-readme-stats\.mjs|\.github/workflows/registry\.yml)$'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build statistics JSON
        if: steps.changes.outputs.changed == 'true'
        id: stats
        run: node .github/scripts/registry-readme-stats.mjs collect
      - name: Render Markdown table
        if: steps.changes.outputs.changed == 'true'
        id: markdown
        uses: parkerbxyz/json-to-markdown-table@85a9c13bbd4d87113503b5802fb3d7cbacb5f43f # v1
        with:
          json: ${{ steps.stats.outputs.json }}
          align-pipes: 'false'
      - name: Replace README section
        if: steps.changes.outputs.changed == 'true'
        env:
          GENERATED_TABLE: ${{ steps.markdown.outputs.table }}
        run: node .github/scripts/registry-readme-stats.mjs replace
      - name: Commit README
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git add README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='github-actions[bot]@users.noreply.github.com' commit -m 'docs(registry): refresh README statistics'
          git push
